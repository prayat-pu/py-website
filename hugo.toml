baseURL = 'https://prayat-pu.github.io/py-website/'
locale = 'en-us'
title = 'My Resource Hub'
theme = 'PaperMod'

# Absolute root paths for assets and links
canonifyURLs = false
relativeURLs = false

[params]
    env = 'production'
    title = 'My Resource Hub'
    
    [params.profileMode]
        enabled = true
        buttons = [
            { name = 'Blog', url = '/posts/' },
            { name = 'Resources', url = '/resources/' }
        ]

[menu]
    [[menu.main]]
        name = 'Home'
        url = '/'
        weight = 10
    [[menu.main]]
        name = 'Posts'
        url = '/posts/'
        weight = 20
    [[menu.main]]
        name = 'Resources'
        url = '/resources/'
        weight = 30
    [[menu.main]]
        name = 'Resume'
        url = '/resume/'
        weight = 40
    [[menu.main]]
        name = 'About'
        url = '/about/'
        weight = 50
