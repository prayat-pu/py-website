<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- if eq .name "email" }}
    <a href="javascript:void(0)" onclick="promptEmail('{{ trim .url "mailto:" }}')"
        title="Click to copy email" class="email-toggle">
        {{ partial "svg.html" . }}
    </a>
    {{- else }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
    {{- end }}
</div>

<script>
function promptEmail(email) {
    window.prompt("My email address is:", email);
}
</script>
